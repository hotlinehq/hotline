# Kraken's Spot WebSocket v2, market data and trading, for Hotline: one GET /v2
# that answers 101, with every operation and message in AsyncAPI 3's shapes under
# x-async-api, so the proxy names and checks each message and records its
# operation, role and correlation id (req_id). Both of Kraken's WebSockets,
# ws.kraken.com (market data) and ws-auth.kraken.com (trading), use this file.
#
# Written by a script from the unofficial AsyncAPI file in the Hotline project
# files (kraken-v2/kraken-v2.asyncapi.yaml, from Kraken's reference pages read
# 2026-11-20); the script is kraken-e2e/to_openapi.py.txt there. Change the
# AsyncAPI file or the script, then write this file again; don't edit it by hand.
# Used by the WebSocket message tests and the Kraken load case.
#
# The operations are seen from Kraken, as OpenAPI is: receive means the app
# sends it, send means Kraken sends it. A failed subscribe can't say which
# channel it was for, so it is an operation of its own (subscribeFailed), whose
# message answers a request of any operation by its req_id.
openapi: 3.2.0
info:
  title: Kraken Spot WebSocket API v2
  version: 2.0.0
servers:
- url: https://ws.kraken.com
- url: https://ws-auth.kraken.com
paths:
  /v2:
    get:
      operationId: webSocket
      responses:
        '101':
          description: Switched to a WebSocket; the session follows.
      x-async-api:
        operations:
          ping:
            action: receive
            messages:
            - $ref: '#/components/x-async-api/messages/ping'
