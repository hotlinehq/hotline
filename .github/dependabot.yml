# Keeps the pinned base images in the proxy's Dockerfile up to date, so the
# image gets Debian's security fixes (Peter, 2026-11-01).
version: 2
updates:
  - package-ecosystem: docker
    directory: /src/hotline-proxy
    schedule:
      interval: weekly

  # Keeps the GitHub Actions pinned to exact commits up to date, so pinning
  # does not leave us on old versions (Aikido finding, 2026-11-02).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
