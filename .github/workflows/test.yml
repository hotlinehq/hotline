name: go-tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-ci:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          check-latest: false
          cache-dependency-path: |
            src/hotline/go.sum
            src/hotline-proxy/go.sum
            src/otel-hotline/go.sum
            src/otelcol-dev/go.sum
            examples/aws-shop/go.sum
            tools/aws-openapi/go.sum
            go.work.sum
      - name: check the Mac signing script
        run: bash .github/scripts/sign-mac-program-test.sh
      - name: run tests
        run: |
          make clean-cache
          make test
      - name: check coverage threshold
        run: make cover
      - name: render coverage report
        if: failure()
        run: |
          if [ -f cover.out ]; then
            go tool cover -func=cover.out > cover.txt
            go tool cover -html=cover.out -o cover.html
          fi
      - name: upload coverage report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            cover.out
            cover.txt
            cover.html
          if-no-files-found: ignore
          retention-days: 7
      - name: shrink build caches
        if: always()
        run: make clean-cache
