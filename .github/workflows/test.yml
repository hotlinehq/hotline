name: go-tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-ci:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: |
            src/hotline/go.sum
            src/hotline-proxy/go.sum
            src/otel-hotline/go.sum
            src/otelcol-dev/go.sum
            examples/aws-shop/go.sum
            tools/aws-openapi/go.sum
            tools/stripe-openapi/go.sum
            go.work.sum
      - name: check the Mac signing script
        run: bash .github/scripts/sign-mac-program-test.sh
      # The path probe's ping tests need the ICMP socket an ordinary user
      # may open. Docker allows it by default; this runner does not.
      - name: let the tests ping
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      # Downloads go first, tried up to three times: a dropped download
      # from the module proxy once failed every package (docs/flakes.md).
      - name: download modules
        run: |
          for try in 1 2 3; do
            go mod download && exit 0
            echo "module download failed (try $try), trying again"
            sleep 10
          done
          exit 1
      - name: run tests
        run: |
          make clean-cache
          make test
      - name: check coverage threshold
        run: make cover
      - name: render coverage report
        if: failure()
        run: |
          if [ -f cover.out ]; then
            go tool cover -func=cover.out > cover.txt
            go tool cover -html=cover.out -o cover.html
          fi
      - name: upload coverage report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            cover.out
            cover.txt
            cover.html
          if-no-files-found: ignore
          retention-days: 7
      - name: shrink build caches
        if: always()
        run: make clean-cache

  # A scenario this pull request adds or changes runs 10 more times, so one
  # that passes only sometimes fails here, before it is merged
  # (docs/flakes.md). Scenarios it did not touch are not run again.
  repeat-new-scenarios:
    name: repeat new scenarios
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: find the scenarios this pull request adds or changes
        id: changed
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          scenarios=$(.github/scripts/changed-scenarios.sh "$base" | paste -sd, -)
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "scenarios: ${scenarios:-none}"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: steps.changed.outputs.scenarios != ''
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: |
            src/hotline-proxy/go.sum
            go.work.sum
      - name: download modules
        if: steps.changed.outputs.scenarios != ''
        run: |
          for try in 1 2 3; do
            go mod download && exit 0
            echo "module download failed (try $try), trying again"
            sleep 10
          done
          exit 1
      - name: let the tests ping
        if: steps.changed.outputs.scenarios != ''
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      # A change to a Background runs its whole file 10 times, which can
      # take longer than go test's own 10 minutes.
      - name: run them 10 times
        if: steps.changed.outputs.scenarios != ''
        working-directory: src/hotline-proxy
        env:
          HOTLINE_FEATURES: ${{ steps.changed.outputs.scenarios }}
        run: go test -count=10 -timeout 30m -run '^TestFeatures$' .
