# Fuzzes the proxy every night, and when someone starts it by hand:
# Actions tab, "fuzz", Run workflow (Peter, 2026-11-18). Fuzzing makes up
# input after input and keeps any input that makes the proxy panic, answer
# too slowly or stop answering. See docs/decisions/fuzzing.md.
#
# Each target runs for 5 minutes on its own GitHub machine, all side by
# side. The six through the proxy's ways in are in fuzz_test.go; the nine
# straight at the parsers are built only with the fuzz tag. When a target
# finds an input, the job fails and saves the input as the artifact
# fuzz-<target>. Nothing is pushed: a person adds the input to
# testdata/fuzz/<target>/ with its fix and a behaviour test.
#
# Go sends a fuzz worker's output nowhere, so a crash left only "fuzzing
# process hung or terminated unexpectedly". The fuzz tests now write each
# worker's output to fuzz-logs/ (internal/fuzzlog); a failing job prints
# every crash in its log and saves it with the input.
#
# The race job runs every test under Go's race detector, which flags two
# goroutines that touch the same memory. Pull requests skip it to stay fast
# (Makefile), so it runs here, nightly.
#
# 01:00 UTC is 02:00 in Prague in winter and 03:00 in summer.
name: fuzz
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: how long each target runs, such as 5m or 30s
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzFirstBytes, package: ., tags: '' }
          - { target: FuzzRequest, package: ., tags: '' }
          - { target: FuzzRequestBody, package: ., tags: '' }
          - { target: FuzzResponse, package: ., tags: '' }
          - { target: FuzzVerify, package: ., tags: '' }
          - { target: FuzzStreamedResponse, package: ., tags: '' }
          - { target: FuzzReadHello, package: ., tags: fuzz }
          - { target: FuzzSentID, package: ., tags: fuzz }
          - { target: FuzzWireFrames, package: ., tags: fuzz }
          - { target: FuzzSSEEvents, package: ., tags: fuzz }
          - { target: FuzzLineItems, package: ., tags: fuzz }
          - { target: FuzzFormParts, package: ., tags: fuzz }
          - { target: FuzzForm, package: ./internal/spec/read, tags: fuzz }
          - { target: FuzzXML, package: ./internal/spec/read, tags: fuzz }
          - { target: FuzzDecodeJSON, package: ./internal/santhosh, tags: fuzz }
          - { target: FuzzReadLine, package: ./internal/export, tags: fuzz }
    defaults:
      run:
        working-directory: src/hotline-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: |
            src/hotline-proxy/go.sum
            go.work.sum
      - name: fuzz ${{ matrix.target }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
          TAGS: ${{ matrix.tags }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          HOTLINE_FUZZ_LOGS: ${{ github.workspace }}/fuzz-logs
        # go test's own -timeout does not cover fuzzing, so timeout stops a
        # run that is still going 3 minutes after its fuzz time. SIGQUIT
        # makes Go print where every goroutine waits before it exits.
        run: |
          mkdir -p "$HOTLINE_FUZZ_LOGS"
          if [[ ! "$FUZZTIME" =~ ^([0-9]+)([smh])$ ]]; then
            echo "fuzztime must be a number and s, m or h, such as 5m" >&2
            exit 2
          fi
          number="${BASH_REMATCH[1]}"
          case "${BASH_REMATCH[2]}" in
            s) seconds=$((10#$number)) ;;
            m) seconds=$((10#$number * 60)) ;;
            h) seconds=$((10#$number * 3600)) ;;
          esac
          timeout --signal=QUIT --kill-after=30s "$((seconds + 180))s" \
            go test -tags "$TAGS" -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME" "$PACKAGE"
      - name: show why a fuzz process crashed
        if: failure()
        # A crash leaves a Go panic or fatal error in its worker's file, and
        # a fuzz test whose setup failed says "fuzz setup failed:".
        run: |
          crashed=0
          for log in "$GITHUB_WORKSPACE"/fuzz-logs/*.log; do
            first=$(grep -m1 -E '^(panic|fatal error|fuzz setup failed):' "$log" 2>/dev/null) || continue
            crashed=1
            echo "::error title=fuzz process crashed::$first"
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done
          [ "$crashed" = 1 ] || echo "no fuzz process crashed"
      - name: save the input that broke a rule
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            src/hotline-proxy/**/testdata/fuzz/${{ matrix.target }}/
            fuzz-logs/
          if-no-files-found: ignore
          retention-days: 30

  race:
    name: race detector
    runs-on: ubuntu-24.04
    # The whole suite takes about 8 minutes under the race detector, close
    # to go test's own 10 minute limit, which it once passed. go test gets
    # 25 minutes, inside the job's 30.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/hotline-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: |
            src/hotline-proxy/go.sum
            go.work.sum
      # The path probe's ping tests need the ICMP socket an ordinary user
      # may open. Docker allows it by default; this runner does not.
      - name: let the tests ping
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      # The fuzz tag adds the parsers' fuzz targets, whose saved inputs then
      # run as plain tests too.
      - name: every test under the race detector
        run: go test -race -count=1 -timeout 25m -tags fuzz ./...
