name: aws-shop-floci
# Runs the shop example (examples/aws-shop) through the Hotline proxy against
# Floci, a free local copy of AWS: Terraform makes the resources, the proxy
# records every call in full to a file, and the file is kept as an artifact.
# When the Grafana Cloud secrets are set, the proxy also sends its usual
# records, counts and traces there. Runs after every merge to main, and by
# hand (Peter, 2026-11-21).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-shop-floci:
    name: shop example on Floci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: |
            src/hotline-proxy/go.sum
            examples/aws-shop/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - name: Grafana Cloud auth
        # The same Grafana Cloud stack and secrets as the lint workflow. Without
        # them nothing is sent to Grafana Cloud.
        env:
          OTLP_USER: ${{ secrets.GRAFANA_OTLP_USERNAME }}
          OTLP_PASSWORD: ${{ secrets.K6_PROMETHEUS_RW_PASSWORD }}
          OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
        run: |
          if [ -n "$OTLP_USER" ] && [ -n "$OTLP_PASSWORD" ] && [ -n "$OTLP_ENDPOINT" ]; then
            auth="Basic $(printf '%s:%s' "$OTLP_USER" "$OTLP_PASSWORD" | base64 -w0)"
            echo "::add-mask::$auth"
            echo "GRAFANA_OTLP_AUTHORIZATION=$auth" >> "$GITHUB_ENV"
            echo "GRAFANA_OTLP_ENDPOINT=$OTLP_ENDPOINT" >> "$GITHUB_ENV"
          fi
      - name: run the shop story on Floci
        working-directory: examples/aws-shop/floci
        run: ./run.sh
      - name: keep every call, in full, as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aws-shop-floci-calls
          path: |
            examples/aws-shop/floci/out/calls/
            examples/aws-shop/floci/out/run-shop.log
            examples/aws-shop/floci/out/proxy.log
          if-no-files-found: warn
          retention-days: 14
