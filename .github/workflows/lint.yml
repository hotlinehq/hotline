name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Records this job's calls (the failed downloads, for example) to Grafana
      # Cloud through Hotline, without changing the steps below. First on
      # purpose: it sees only what comes after it. Without the secrets (pull
      # requests from forks) nothing is set up. Trial, Peter 2026-11-08.
      - name: hotline auth
        env:
          OTLP_USER: ${{ secrets.GRAFANA_OTLP_USERNAME }}
          OTLP_PASSWORD: ${{ secrets.K6_PROMETHEUS_RW_PASSWORD }}
        run: |
          if [ -n "$OTLP_USER" ] && [ -n "$OTLP_PASSWORD" ]; then
            auth="Basic $(printf '%s:%s' "$OTLP_USER" "$OTLP_PASSWORD" | base64 -w0)"
            echo "::add-mask::$auth"
            echo "GRAFANA_OTLP_AUTH=$auth" >> "$GITHUB_ENV"
          fi
      - name: hotline
        if: ${{ env.GRAFANA_OTLP_AUTH != '' }}
        uses: petercipov/hotline-github-action@2767d03c0c7143467fb6eda3a3ca815e5dc290de # hotline-github-action main, with record-urls
        with:
          signing-key: ${{ secrets.HOTLINE_SIGNING_KEY }}
          record-urls: 'true'
          exporters: |
            - otlp:
                endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
                headers:
                  Authorization: { env: GRAFANA_OTLP_AUTH }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: golangci-lint-hotline
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: ./src/hotline
      - name: golangci-lint-hotline-proxy
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: ./src/hotline-proxy
      - name: golangci-lint-otel-hotline
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: ./src/otel-hotline
      - name: golangci-lint-example-aws-shop
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: ./examples/aws-shop
      - name: golangci-lint-tools-aws-openapi
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: ./tools/aws-openapi
      - name: hotline teardown
        if: ${{ always() && env.GRAFANA_OTLP_AUTH != '' }}
        uses: petercipov/hotline-github-action/teardown@2767d03c0c7143467fb6eda3a3ca815e5dc290de # hotline-github-action main, with record-urls
