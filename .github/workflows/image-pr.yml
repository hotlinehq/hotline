# On pull requests that change the proxy's code or its Dockerfile: builds and
# checks the image, and pushes nothing. A pull request that only changes the load test, docs or any
# workflow (the image workflows too) builds no image (Peter, 2026-11-02).
# The jobs are in image-build.yml. Detail: docs/proxy-docker-image.md.
name: image pr
on:
  pull_request:
    paths:
      - 'src/hotline-proxy/**'

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/image-build.yml
