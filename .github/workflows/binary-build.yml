# Builds the hotline-proxy program for Linux on amd64 and arm64, and for
# macOS on arm64, and the Docker image. Shared by binary-pr.yml (pull
# requests) and binary-release.yml (main and release tags), so both build
# the very same way. Detail: docs/proxy-binaries.md and
# docs/proxy-docker-image.md.
#
# The next step is binary-package.yml, which gathers the programs with the
# SBOM and the checksums. Signing the Mac program and the smoke tests are
# not here: they run only in binary-release.yml, so a pull request shows no
# skipped jobs (Peter, 2026-11-21).
#
# build makes each program in its own job, all at the same time (Peter,
# 2026-11-10). The image is made by copying the Linux programs in: it
# compiles nothing, so the image holds the very program that was built
# (Peter, 2026-11-10).
name: binary build
on:
  workflow_call:
    outputs:
      version:
        description: what the program prints after its name
        value: ${{ jobs.version.outputs.version }}
      label:
        description: the version part of the file names (the tag, or edge)
        value: ${{ jobs.version.outputs.label }}
      tags:
        description: the image tags, one per line
        value: ${{ jobs.image.outputs.tags }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hotlinehq/hotline-proxy

jobs:
  # The version the program prints: the git tag on a release, else the
  # commit (as for the image). The file names carry the tag, or edge, so the
  # edge download address never changes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - id: version
        run: |
          echo "version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "label=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}" >> "$GITHUB_OUTPUT"

  # One job per system and architecture, all running at the same time. The
  # same flags as the image used: one static file, no C code.
  build:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: arm64 }
    name: build for ${{ matrix.os == 'darwin' && 'macOS' || 'Linux' }} on ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: src/hotline-proxy/go.sum
      - name: build the program
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        working-directory: src/hotline-proxy
        run: |
          set -eu
          dir=$(mktemp -d)
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${VERSION} -X main.buildCommit=${GITHUB_SHA}" \
            -o "$dir/hotline-proxy" ./cmd
          cp "$GITHUB_WORKSPACE/LICENSE" "$dir/LICENSE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C "$dir" -czf "$GITHUB_WORKSPACE/dist/hotline-proxy_${LABEL}_${GOOS}_${GOARCH}.tar.gz" hotline-proxy LICENSE
      # One file, stored as it is, without a zip (archive: false); its own
      # name is the artifact's name (Peter, 2026-11-10).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/hotline-proxy_${{ needs.version.outputs.label }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          archive: false
          retention-days: 1
          if-no-files-found: error

  # Makes the image by copying the Linux programs onto the base image, for
  # linux/amd64 and linux/arm64, and saves it as one OCI file. Nothing is
  # compiled here.
  # It needs only the built programs, not the SBOM or the checksums (Peter,
  # 2026-11-10).
  image:
    needs: [version, build]
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hotline-proxy_*_linux_*.tar.gz
          merge-multiple: true
          path: dist
      # The Dockerfile copies dist/image/linux_<arch>/hotline-proxy.
      - name: unpack the Linux programs for the image
        run: |
          set -eu
          for arch in amd64 arm64; do
            mkdir -p "dist/image/linux_${arch}"
            tar -C "dist/image/linux_${arch}" -xzf "dist/hotline-proxy_${{ needs.version.outputs.label }}_linux_${arch}.tar.gz" hotline-proxy
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # A release tag v1.2.3 gives 1.2.3, 1.2 and latest; main gives edge;
      # every build gives sha-<short commit>.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short

      # Both platforms, with the SBOM and provenance, saved as one OCI file.
      - name: build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/hotline-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=hotline-proxy.tar
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: hotline-proxy.tar
          archive: false
          retention-days: 1
          if-no-files-found: error
