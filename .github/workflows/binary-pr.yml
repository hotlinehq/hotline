# On pull requests that change the proxy's code or its Dockerfile: builds and
# checks the programs and the image, and publishes nothing. A pull request that
# only changes the load test, docs or any workflow builds nothing (Peter,
# 2026-11-02). The jobs are in binary-build.yml. Detail:
# docs/proxy-binaries.md.
name: binary pr
on:
  pull_request:
    paths:
      - 'src/hotline-proxy/**'

permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/binary-build.yml
