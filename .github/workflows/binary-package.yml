# Gathers the programs that binary-build.yml built, with the SBOM and the
# checksums, as the artifact hotline-programs. Shared by binary-pr.yml and
# binary-release.yml. It is its own file so that binary-release.yml can sign
# the Mac program between the build and this step, and a pull request has no
# signing job at all, not even a skipped one (Peter, 2026-11-21). The
# checksums are made here, after signing, so they cover the signed program.
name: binary package
on:
  workflow_call:
    inputs:
      label:
        description: the version part of the file names (the tag, or edge), from binary-build.yml
        type: string
        required: true
      signed:
        description: use the signed Mac program, the artifact hotline-mac-signed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Gathers the three programs, adds the SBOM and the checksums, and saves
  # them all as the artifact hotline-programs.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          check-latest: false
          cache-dependency-path: src/hotline-proxy/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hotline-proxy_*.tar.gz
          merge-multiple: true
          path: dist
      # The signed Mac tarball replaces the unsigned one of the same name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.signed }}
        with:
          name: hotline-mac-signed
          path: dist
      - name: write the SBOM and the checksums
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -eu
          # The SBOM (software bill of materials: the list of libraries
          # inside), in CycloneDX form, from the module's own files. The tool
          # is pinned by version; Go checks it against its checksum database.
          # The build notes in it say CGO_ENABLED=0, as for the programs; it
          # names linux/amd64, but the libraries are the same for all three.
          (cd src/hotline-proxy && CGO_ENABLED=0 GOWORK=off go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            app -json -licenses=false -main cmd \
            -output "$GITHUB_WORKSPACE/dist/hotline-proxy_${LABEL}_sbom.cdx.json" .)
          cd dist
          sha256sum hotline-proxy_* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hotline-programs
          path: dist/
          retention-days: 1
          if-no-files-found: error
