# On main and on release tags: builds and checks the programs
# (binary-build.yml), then publishes them on GitHub Releases with a checksum
# file and a cosign signature (Peter, 2026-11-10). A tag v1.2.3 makes the
# release v1.2.3; main replaces the one pre-release called edge. Detail:
# docs/proxy-binaries.md.
name: binary release
on:
  push:
    branches:
      - main
    # As for the image: main publishes only when the proxy changes, and
    # release tags always build.
    paths:
      - 'src/hotline-proxy/**'
    tags:
      - 'v*'

permissions:
  contents: read

# One publish at a time, so two main pushes cannot swap the edge files
# halfway.
concurrency:
  group: binary-release
  cancel-in-progress: false

jobs:
  binaries:
    uses: ./.github/workflows/binary-build.yml

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotline-programs
          path: dist

      # Keyless: the signature names this workflow, with no key to keep. It
      # covers SHA256SUMS, which covers every program file.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = tag ]; then
            gh release create "${{ github.ref_name }}" --repo "$REPO" \
              --title "${{ github.ref_name }}" --generate-notes \
              hotline-proxy_*.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
          else
            # edge is replaced in place, with its tag moved to this commit.
            gh release delete edge --repo "$REPO" --cleanup-tag --yes || true
            gh release create edge --repo "$REPO" --target "${{ github.sha }}" \
              --prerelease --title "edge" \
              --notes "The newest build of main, replaced on every change to the proxy. For a stable version use a numbered release. Commit ${{ github.sha }}." \
              hotline-proxy_*.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
          fi
