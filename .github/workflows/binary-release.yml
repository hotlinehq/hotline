# On main and on release tags: builds and checks the programs and the image
# (binary-build.yml), then publishes both: the programs on GitHub Releases
# with a checksum file and a cosign signature, and the image to ghcr.io with
# an SBOM, build provenance and a cosign signature (Peter, 2026-11-10). A tag
# v1.2.3 makes the release v1.2.3 and the image tags 1.2.3, 1.2 and latest;
# main replaces the one pre-release called edge and gives the image tag edge.
# Detail: docs/proxy-binaries.md and docs/proxy-docker-image.md.
name: binary release
on:
  push:
    branches:
      - main
    # As for the image: main publishes only when the proxy changes, and
    # release tags always build.
    paths:
      - 'src/hotline-proxy/**'
    tags:
      - 'v*'
  # By hand, from the Actions page: pick main to publish edge again, or a
  # release tag to publish that release again (Peter, 2026-11-10).
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/petercipov/hotline-proxy

# One publish at a time, so two main pushes cannot swap the edge files
# halfway.
concurrency:
  group: binary-release
  cancel-in-progress: false

jobs:
  binaries:
    uses: ./.github/workflows/binary-build.yml
    with:
      # Every build of main and every release tag signs the Mac program
      # (Peter, 2026-11-11). A by-hand run on another branch does not.
      sign: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    secrets: inherit

  publish:
    needs: binaries
    # A by-hand run on any other branch builds and checks, but publishes
    # nothing.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotline-programs
          path: dist

      # Keyless: the signature names this workflow, with no key to keep. It
      # covers SHA256SUMS, which covers every program file.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # The image, copied unchanged from the file that was checked, with all
      # platforms, the SBOM and the provenance. Docker's login file is read
      # by both skopeo and cosign.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotline-proxy.tar
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --all keeps both platforms, the SBOM and the provenance;
      # --preserve-digests fails rather than change the image.
      - id: push
        name: push the image to ghcr.io
        env:
          TAGS: ${{ needs.binaries.outputs.tags }}
        run: |
          set -eu
          for tag in $TAGS; do
            skopeo copy --all --preserve-digests --digestfile digest \
              oci-archive:hotline-proxy.tar "docker://$tag"
          done
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      - name: sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: publish the programs
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = tag ]; then
            gh release create "${{ github.ref_name }}" --repo "$REPO" \
              --title "${{ github.ref_name }}" --generate-notes \
              hotline-proxy_* SHA256SUMS SHA256SUMS.sigstore.json
          else
            # edge is replaced in place, with its tag moved to this commit.
            gh release delete edge --repo "$REPO" --cleanup-tag --yes || true
            gh release create edge --repo "$REPO" --target "${{ github.sha }}" \
              --prerelease --title "edge" \
              --notes "The newest build of main, replaced on every change to the proxy. For a stable version use a numbered release. Commit ${{ github.sha }}." \
              hotline-proxy_* SHA256SUMS SHA256SUMS.sigstore.json
          fi

  # After edge is published, points the Homebrew tap's edge recipe at it:
  # the new commit and the new checksum of the Mac program, in one commit to
  # hotlinehq/homebrew-hotline (Peter, 2026-11-11). Release tags do not touch
  # the tap. This is a job of its own, so if the tap commit fails the release
  # stays published and this job alone shows red. The recipe text lives in
  # the tap's scripts/update-edge.sh, not here.
  tap:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotline-programs
          path: dist
      - name: update the edge recipe in the tap
        env:
          # A fine-grained token that can write to the tap repository only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::The secret HOMEBREW_TAP_TOKEN is not set, so the tap was not updated. The edge release itself is published."
            exit 1
          fi
          sha256=$(awk '$2 == "hotline-proxy_edge_darwin_arm64.tar.gz" { print $1 }' dist/SHA256SUMS)
          [ -n "$sha256" ] || { echo "::error::SHA256SUMS has no line for the Mac program"; exit 1; }
          # The token goes in a header, never in the address, so it is not
          # kept in the clone's settings. GitHub hides it in the log.
          echo "::add-mask::$TAP_TOKEN"
          auth="Authorization: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#Authorization: basic }"
          git -c "http.extraheader=$auth" clone --depth 1 https://github.com/hotlinehq/homebrew-hotline tap
          tap/scripts/update-edge.sh "$COMMIT" "$sha256"
          cd tap
          if git diff --quiet; then
            echo "The tap already has this edge build."
            exit 0
          fi
          git config user.name "hotline release workflow"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "edge ${COMMIT}"
          git -c "http.extraheader=$auth" push origin HEAD
