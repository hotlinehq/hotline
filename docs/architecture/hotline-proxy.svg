<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" width="1800" height="1000" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Hotline proxy: forwards every vendor call unchanged and records how it went</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FEF2F2"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FCA5A5" stroke-width="4"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1800" height="1050" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="60" y="78" font-size="38" font-weight="700" fill="#0F172A">hotline</text>
  <text x="208" y="78" font-size="38" font-weight="400" fill="#64748B">proxy</text>
  <text x="60" y="116" font-size="20" fill="#475569">Sits between your services and vendor APIs. Forwards every call unchanged and records how it went.</text>

  <!-- Legend -->
  <g font-size="16" fill="#334155">
    <rect x="1250" y="40" width="18" height="18" rx="4" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <text x="1278" y="55">Ingress</text>
    <rect x="1380" y="40" width="18" height="18" rx="4" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/>
    <text x="1408" y="55">Call path</text>
    <rect x="1530" y="40" width="18" height="18" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1558" y="55">Checks &amp; records</text>
    <rect x="1250" y="76" width="18" height="18" rx="4" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1278" y="91">Evidence &amp; export</text>
    <rect x="1450" y="76" width="18" height="18" rx="4" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/>
    <text x="1478" y="91">Security boundary</text>
    <line x1="1250" y1="121" x2="1288" y2="121" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1298" y="127">Config</text>
  </g>

  <!-- Your services -->
  <text x="150" y="374" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">Your services</text>
  <g font-size="14" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">
    <rect x="60" y="394" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="80" cy="416" r="5" fill="#22C55E"/>
    <text x="94" y="421">checkout</text>
    <rect x="60" y="450" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="80" cy="472" r="5" fill="#22C55E"/>
    <text x="94" y="477">invoices</text>
    <rect x="60" y="506" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="80" cy="528" r="5" fill="#22C55E"/>
    <text x="94" y="533">mailer</text>
    <rect x="60" y="562" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="80" cy="584" r="5" fill="#22C55E"/>
    <text x="94" y="589">refunds</text>
    <rect x="60" y="618" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="80" cy="640" r="5" fill="#22C55E"/>
    <text x="94" y="645">support</text>
  </g>
  <text x="150" y="690" font-size="13" fill="#64748B" text-anchor="middle">any HTTP client,</text>
  <text x="150" y="708" font-size="13" fill="#64748B" text-anchor="middle">no code change</text>
  <path d="M240,528 L276,528" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingresses -->
  <rect x="280" y="200" width="270" height="680" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="304" y="240" font-size="22" font-weight="700" fill="#0F172A">Ingresses</text>
  <text x="304" y="264" font-size="15" fill="#64748B">how a call reaches the proxy</text>

  <g filter="url(#shadow)">
    <rect x="300" y="288" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <rect x="300" y="376" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <rect x="300" y="464" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <rect x="300" y="552" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <rect x="300" y="640" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
    <rect x="300" y="728" width="230" height="76" rx="14" fill="#FFF4EC" stroke="#F97316" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="700" fill="#9A3412">
    <text x="320" y="318">HTTP proxy</text>
    <text x="320" y="406">URL in path</text>
    <text x="320" y="494">Host header</text>
    <text x="320" y="582">CONNECT tunnel</text>
    <text x="320" y="670">Transparent</text>
    <text x="320" y="758">Capture</text>
  </g>
  <g font-size="13" fill="#7C2D12" font-family="'SF Mono', Menlo, Consolas, monospace">
    <text x="320" y="344">HTTPS_PROXY=http://…</text>
    <text x="320" y="432">/https://api.stripe.com/…</text>
    <text x="320" y="520">Host: api.stripe.com</text>
    <text x="320" y="608">signs a cert per host</text>
    <text x="320" y="696">network-redirected http</text>
    <text x="320" y="784">macOS apps, socket file</text>
  </g>
  <text x="415" y="862" font-size="13" fill="#64748B" text-anchor="middle">Proxy-Authorization names the integration</text>

  <!-- Proxy container -->
  <rect x="590" y="200" width="760" height="756" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="614" y="240" font-size="22" font-weight="700" fill="#0F172A">hotline-proxy</text>
  <text x="772" y="240" font-size="16" fill="#64748B">Go, one program</text>

  <path d="M550,520 C575,520 575,316 616,316" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1: call path -->
  <g filter="url(#shadow)">
    <rect x="620" y="264" width="240" height="110" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/>
    <rect x="900" y="264" width="320" height="110" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/>
  </g>
  <text x="740" y="302" font-size="20" font-weight="700" fill="#155E75" text-anchor="middle">Ingress finder</text>
  <text x="740" y="328" font-size="14" fill="#164E63" text-anchor="middle">which integration,</text>
  <text x="740" y="349" font-size="14" fill="#164E63" text-anchor="middle">which vendor api</text>
  <text x="1060" y="302" font-size="20" font-weight="700" fill="#155E75" text-anchor="middle">Forwarder</text>
  <text x="1060" y="328" font-size="14" fill="#164E63" text-anchor="middle">calls the vendor, bytes unchanged</text>
  <text x="1060" y="349" font-size="14" fill="#164E63" text-anchor="middle">times dns · connect · tls · first byte</text>
  <path d="M860,319 L896,319" fill="none" stroke="#0E7490" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Address guard -->
  <rect x="1262" y="244" width="56" height="150" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/>
  <text x="1290" y="319" font-size="15" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1290 319)">address guard</text>
  <text x="1290" y="414" font-size="12" fill="#991B1B" text-anchor="middle">no loopback,</text>
  <text x="1290" y="430" font-size="12" fill="#991B1B" text-anchor="middle">no private IPs</text>
  <path d="M1220,319 L1258,319" fill="none" stroke="#0E7490" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Vendor APIs -->
  <text x="1570" y="246" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Vendor APIs</text>
  <g font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">
    <rect x="1410" y="264" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1430" cy="286" r="5" fill="#22C55E"/>
    <text x="1444" y="291">api.stripe.com</text>
    <rect x="1410" y="316" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1430" cy="338" r="5" fill="#22C55E"/>
    <text x="1444" y="343">hooks.slack.com</text>
    <rect x="1410" y="368" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1430" cy="390" r="5" fill="#22C55E"/>
    <text x="1444" y="395">api.anthropic.com</text>
    <rect x="1410" y="420" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1430" cy="442" r="5" fill="#22C55E"/>
    <text x="1444" y="447">ws.kraken.com</text>
    <rect x="1410" y="472" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="1430" cy="494" r="5" fill="#22C55E"/>
    <text x="1444" y="499">sqs.eu-west-1.amazonaws.com</text>
  </g>
  <path d="M1318,319 C1360,319 1360,338 1406,338" fill="none" stroke="#0E7490" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="1570" y="538" font-size="13" fill="#64748B" text-anchor="middle">each api: hosts, OpenAPI 3.2 spec, timeout</text>

  <!-- Row 2: checks and records -->
  <path d="M1060,374 C1060,420 725,410 725,462" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1072" y="404" font-size="13" fill="#6D28D9">body copies, timings</text>

  <g filter="url(#shadow)">
    <rect x="620" y="466" width="210" height="126" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="725" y="504" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Body tap</text>
  <text x="725" y="530" font-size="14" fill="#4C1D95" text-anchor="middle">passes bodies on,</text>
  <text x="725" y="551" font-size="14" fill="#4C1D95" text-anchor="middle">keeps a copy ≤ 2 MiB,</text>
  <text x="725" y="572" font-size="14" fill="#4C1D95" text-anchor="middle">cuts streams into items</text>

  <rect x="882" y="450" width="230" height="126" rx="14" fill="#E9E0FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="874" y="458" width="230" height="126" rx="14" fill="#EEE7FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="866" y="466" width="230" height="126" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="981" y="504" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Spec checks × N</text>
  <text x="981" y="530" font-size="14" fill="#4C1D95" text-anchor="middle">each side against the spec,</text>
  <text x="981" y="551" font-size="14" fill="#4C1D95" text-anchor="middle">each message and stream item,</text>
  <text x="981" y="572" font-size="14" fill="#4C1D95" text-anchor="middle">beside the call, not in its way</text>
  <path d="M830,529 L862,529" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <g filter="url(#shadow)">
    <rect x="1136" y="466" width="192" height="126" rx="14" fill="#F3EEFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="1230" y="504" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Record builder</text>
  <text x="1230" y="530" font-size="14" fill="#4C1D95" text-anchor="middle">redacts secrets,</text>
  <text x="1230" y="551" font-size="14" fill="#4C1D95" text-anchor="middle">SHA-256 per record,</text>
  <text x="1230" y="572" font-size="14" fill="#4C1D95" text-anchor="middle">per call, message, item</text>
  <path d="M1112,529 L1132,529" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="981" y="614" font-size="13" fill="#64748B" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">specChecks.queueMemory: 64MiB</text>

  <!-- Row 3: evidence and export -->
  <path d="M1180,592 C1180,644 785,644 785,692" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="770" y="652" font-size="13" fill="#1D4ED8" text-anchor="end">record hash</text>
  <path d="M1270,592 L1270,676" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1280" y="640" font-size="13" fill="#1D4ED8">record, trace</text>

  <g filter="url(#shadow)">
    <rect x="620" y="696" width="330" height="110" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="785" y="734" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Evidence ledger</text>
  <text x="785" y="760" font-size="14" fill="#1E3A8A" text-anchor="middle">one chain per integration</text>
  <text x="785" y="781" font-size="14" fill="#1E3A8A" text-anchor="middle">batch every 10 s, signed Ed25519</text>

  <rect x="1022" y="680" width="300" height="110" rx="14" fill="#E0EAFF" stroke="#93B4F5" stroke-width="1.5"/>
  <rect x="1014" y="688" width="300" height="110" rx="14" fill="#E8F0FF" stroke="#93B4F5" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="1006" y="696" width="300" height="110" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1156" y="734" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Exporters</text>
  <text x="1156" y="760" font-size="14" fill="#1E3A8A" text-anchor="middle">one bounded queue each</text>
  <text x="1156" y="781" font-size="14" fill="#1E3A8A" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">otlp · file · console</text>
  <path d="M950,751 L1002,751" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="976" y="740" font-size="13" fill="#1D4ED8" text-anchor="middle">batch</text>

  <!-- Row 4: config and admin -->
  <g filter="url(#shadow)">
    <rect x="620" y="840" width="300" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="940" y="840" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1136" y="840" width="186" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="640" y="874" font-size="17" font-weight="700" fill="#0F172A">Config loader</text>
  <text x="640" y="902" font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">watches the file, reloads live</text>
  <text x="958" y="874" font-size="17" font-weight="700" fill="#0F172A">Admin port</text>
  <text x="958" y="900" font-size="12" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">/livez · /readyz</text>
  <text x="958" y="919" font-size="12" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">pprof, when on</text>
  <text x="1154" y="874" font-size="17" font-weight="700" fill="#0F172A">Probes</text>
  <text x="1154" y="900" font-size="12" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">why a connect failed</text>
  <text x="1154" y="919" font-size="12" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">dns, tcp, tls, path</text>
  <path d="M620,888 L604,888 L604,400 L660,400 L660,378" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="672" y="396" font-size="13" fill="#64748B">integrations, specs, certs</text>

  <!-- Exporters -->
  <g filter="url(#shadow)">
    <rect x="1410" y="640" width="320" height="82" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1410" y="742" width="320" height="82" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1410" y="844" width="320" height="82" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="1430" y="674" font-size="17" font-weight="700" fill="#0F172A">OTLP collector, own tools</text>
  <text x="1430" y="700" font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">OTLP logs · traces</text>
  <text x="1430" y="776" font-size="17" font-weight="700" fill="#0F172A">Local folder</text>
  <text x="1430" y="802" font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">hotline-proxy verify &lt;folder&gt;</text>
  <text x="1430" y="878" font-size="17" font-weight="700" fill="#0F172A">Terminal</text>
  <text x="1430" y="904" font-size="13" fill="#334155" font-family="'SF Mono', Menlo, Consolas, monospace">two coloured lines per call</text>
  <path d="M1322,740 C1366,740 1360,681 1406,681" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M1322,760 C1366,760 1360,783 1406,783" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M1322,780 C1366,780 1360,885 1406,885" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Footer -->
  <line x1="60" y1="980" x2="1740" y2="980" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-size="15" fill="#475569">
    <text x="60" y="1012"><tspan font-weight="700" fill="#0F172A">Never in the way:</tspan> the call goes out unchanged · checks run beside it · every record hashed, every batch signed</text>
    <text x="1740" y="1012" text-anchor="end">hotline.ingress: forward_proxy · url_in_path · host_header · connect · transparent · capture</text>
  </g>
</svg>
