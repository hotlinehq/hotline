# The api of the WebSocket load case: Gemini Live's opening call, as in
# specs/google/gemini-live, with the messages the load case sends listed in
# AsyncAPI 3's shapes under x-async-api, so the proxy names and checks each
# one and records its operation, role and correlation id. Written for the
# load test only, from Google's Live API reference; not a full description
# of Gemini Live.
openapi: 3.2.0
info:
  title: Gemini Live messages for the load test
  version: v1beta
paths:
  /ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent:
    get:
      operationId: BidiGenerateContent
      responses:
        "101":
          description: Switched to a WebSocket; the session follows.
      x-async-api:
        operations:
          setup:
            action: receive # the vendor receives it, so the app sends it
            messages: [{ $ref: "#/components/x-async-api/messages/setup" }]
            reply:
              messages: [{ $ref: "#/components/x-async-api/messages/setupComplete" }]
          audio:
            action: receive
            messages: [{ $ref: "#/components/x-async-api/messages/realtimeInput" }]
          answer:
            action: send # the vendor sends it
            messages: [{ $ref: "#/components/x-async-api/messages/serverContent" }]
          toolCall:
            action: send
            messages: [{ $ref: "#/components/x-async-api/messages/toolCall" }]
            reply:
              messages: [{ $ref: "#/components/x-async-api/messages/toolResponse" }]
components:
  x-async-api:
    messages:
      setup: { payload: { $ref: "#/components/schemas/setup" } }
      setupComplete: { payload: { $ref: "#/components/schemas/setupComplete" } }
      realtimeInput: { payload: { $ref: "#/components/schemas/realtimeInput" } }
      serverContent: { payload: { $ref: "#/components/schemas/serverContent" } }
      toolCall:
        payload: { $ref: "#/components/schemas/toolCall" }
        correlationId: { location: "$message.payload#/toolCall/functionCalls/0/id" }
      toolResponse:
        payload: { $ref: "#/components/schemas/toolResponse" }
        correlationId: { location: "$message.payload#/toolResponse/functionResponses/0/id" }
  schemas:
    blob:
      type: object
      required: [mimeType, data]
      properties:
        mimeType: { type: string }
        data: { type: string, contentEncoding: base64 }
    setup:
      type: object
      required: [setup]
      properties:
        setup:
          x-hotline-match: true
          type: object
          required: [model]
          properties:
            model: { type: string }
            generationConfig:
              type: object
              properties:
                responseModalities: { type: array, items: { enum: [TEXT, AUDIO] } }
    realtimeInput:
      type: object
      required: [realtimeInput]
      properties:
        realtimeInput:
          x-hotline-match: true
          type: object
          properties:
            audio: { $ref: "#/components/schemas/blob" }
    toolResponse:
      type: object
      required: [toolResponse]
      properties:
        toolResponse:
          x-hotline-match: true
          type: object
          required: [functionResponses]
          properties:
            functionResponses:
              type: array
              items:
                type: object
                required: [id, name, response]
                properties:
                  id: { type: string }
                  name: { type: string }
                  response: { type: object }
    setupComplete:
      type: object
      required: [setupComplete]
      properties:
        setupComplete: { type: object, x-hotline-match: true }
    serverContent:
      type: object
      required: [serverContent]
      properties:
        serverContent:
          x-hotline-match: true
          type: object
          properties:
            modelTurn:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      inlineData: { $ref: "#/components/schemas/blob" }
        usageMetadata:
          type: object
          properties:
            totalTokenCount: { type: integer, x-hotline-record: gen_ai.usage.total_tokens }
    toolCall:
      type: object
      required: [toolCall]
      properties:
        toolCall:
          x-hotline-match: true
          type: object
          required: [functionCalls]
          properties:
            functionCalls:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
                  args: { type: object }
