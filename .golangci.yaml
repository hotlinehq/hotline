version: "2"
run:
  # Lint the end-to-end tests too.
  build-tags:
    - e2e
formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - ginkgolinter
    - revive
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - errorlint
    - errname
    - err113
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - godox
    - gosec
    - iface
    - intrange
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - sloglint
    - spancheck
    - tagalign
    - tagliatelle
    - testifylint
    - testpackage
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G404
    tagliatelle:
      case:
        rules:
          # Every JSON name Hotline writes, such as the hotline.verify.v1
          # report and the exported lines, is in snake case, as agreed.
          json: snake
          yaml: camel
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true