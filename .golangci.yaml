version: "2"
run:
  # Lint the end-to-end tests too.
  build-tags:
    - e2e
formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - ginkgolinter
    - revive
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - errorlint
    - errname
    - err113
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - godox
    - gosec
    - iface
    - intrange
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - sloglint
    - spancheck
    - tagalign
    - tagliatelle
    - testifylint
    - testpackage
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G404
    tagliatelle:
      case:
        overrides:
          # Every JSON name the proxy writes, such as the hotline.verify.v1
          # report and the exported lines, is in snake case, as agreed.
          # Other modules read or play formats in camel case.
          - pkg: hotline-proxy
            rules:
              json: snake
              yaml: camel
    nolintlint:
      # Every skip names its linter and says why, and a skip the linter no
      # longer needs is itself reported, so stale skips do not pile up.
      require-explanation: true
      require-specific: true
    staticcheck:
      # Ginkgo and Gomega are written to be read with dot imports, as every
      # test here imports them; the shared spec checks do the same.
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    rules:
      # The file exporter writes only inside the folder the config names,
      # with files of mode 0640, as docs/proxy-file-export.md says. The
      # path and permission checks would only repeat that on each line.
      - path: internal/export/file\.go$
        linters:
          - gosec
        text: "G302|G304"
